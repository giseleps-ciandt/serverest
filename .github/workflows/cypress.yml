name: Cypress Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      grep_tags:
        description: 'Filter tests by tags (e.g., @api, @frontend, @login). Use | for OR, , for AND'
        required: false
        default: ''

jobs:
  cypress-api:
    name: API Tests
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.grep_tags == '' ||
      !(contains(github.event.inputs.grep_tags, '@frontend') && !contains(github.event.inputs.grep_tags, '@api'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API Tests
        run: npm run cy:run:tags
        env:
          GREP_TAGS: ${{ github.event.inputs.grep_tags || '@api' }}

      - name: Upload API Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: cypress/reports/
          retention-days: 30

  cypress-frontend:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.grep_tags == '' ||
      !(contains(github.event.inputs.grep_tags, '@api') && !contains(github.event.inputs.grep_tags, '@frontend'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend E2E Tests
        run: npm run cy:run:tags
        env:
          GREP_TAGS: ${{ github.event.inputs.grep_tags || '@frontend' }}

      - name: Upload Frontend Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-report
          path: cypress/reports/
          retention-days: 30
